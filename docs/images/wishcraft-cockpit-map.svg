<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Wishcraft operator cockpit map</title><desc id="desc">Wishcraft surrounds the Pi editor with a live Signal bar, Deck navigation, idea capture, skills, managed shell helpers and policy hooks while Pi remains the engine.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d14"/><stop offset="1" stop-color="#151326"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-opacity=".3"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="90" y="90" fill="#f8fafc" font-family="ui-monospace,monospace" font-size="40" font-weight="700">Wishcraft is the operator layer around Pi.</text><text x="90" y="134" fill="#9aa7b6" font-family="system-ui,sans-serif" font-size="22">Pi keeps the agent loop. Wishcraft adds the cockpit you touch while it runs.</text>
<g filter="url(#s)"><rect x="200" y="240" width="1200" height="500" rx="28" fill="#0e141d" stroke="#334155" stroke-width="2"/><rect x="235" y="275" width="1130" height="62" rx="16" fill="#151d29" stroke="#334155"/><text x="270" y="314" fill="#86efac" font-family="ui-monospace,monospace" font-size="18">model  gpt-5.6</text><text x="500" y="314" fill="#93c5fd" font-family="ui-monospace,monospace" font-size="18">git  main +2</text><text x="705" y="314" fill="#f9a8d4" font-family="ui-monospace,monospace" font-size="18">working  bash</text><text x="955" y="314" fill="#fde68a" font-family="ui-monospace,monospace" font-size="18">context  54%</text><text x="1180" y="314" fill="#c4b5fd" font-family="ui-monospace,monospace" font-size="18">queue  3</text>
