name: Release

# Merge to main always cuts a tag. The tag job publishes with the GroepOnline
# org secret NPM_TOKEN (inherited; repo has no override). Put [skip release]
# in the merge commit to opt out.
on:
  push:
    branches: [main]
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    name: bump + tag
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && !startsWith(github.event.head_commit.message, 'chore: release')
      && !contains(github.event.head_commit.message, '[skip release]')
    # GitHub-hosted runners banned until Actions spending restored (fleet only).
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install devDependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Catalog contract
        run: npm run verify:package
      - name: Cut release tag
        run: |
          git fetch origin main --tags --force
          git reset --hard origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs auto --push

  publish:
    name: test + publish
    if: startsWith(github.ref, 'refs/tags/v')
    # GitHub-hosted runners banned until Actions spending restored (fleet only).
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Install devDependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Catalog contract
        run: npm run verify:package
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is missing (expected GroepOnline org secret)."
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@groeponline/pi-wishcraft@${VERSION}" version >/dev/null 2>&1; then
            echo "${VERSION} is already on npm; skip publish"
          else
            npm publish --access public
          fi
      - name: Catalog URLs
        run: |
          echo "npm: https://www.npmjs.com/package/@groeponline/pi-wishcraft"
          echo "pi.dev: https://pi.dev/packages/@groeponline/pi-wishcraft"
          echo "search: https://pi.dev/packages?name=wishcraft"
          echo "groeponline: https://pi.dev/packages?name=groeponline"
