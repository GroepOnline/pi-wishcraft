name: Release

# A main push prepares a release candidate; only an exact candidate SHA that has
# its own Verify check may be promoted to protected main and tagged.
#
# Publish is also dispatachable on a tag ref: tags created via the API under
# GITHUB_TOKEN do not emit an `on: push` tag event (same anti-recursion rule as
# workflow_run), so Promote explicitly dispatches this workflow on the tag it
# just created. The verify/publish `if` conditions below key off
# `github.ref == refs/tags/v*`, which holds for a dispatched run too.
#
# workflow_dispatch.tag is optional so Promote can still dispatch on the tag
# ref with no inputs. When tag is set, the backfill job re-verifies that
# commit and attaches npm pack + SHA256SUMS; it does not publish to npm.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to backfill (re-verify at that tag's commit)
        required: false
        type: string

concurrency:
  group: npm-publish-pi-wishcraft
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && !startsWith(github.event.head_commit.message, 'chore: release')
      && !contains(github.event.head_commit.message, '[skip release]'))
      || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      actions: write  # test.yml's nested verify job needs actions:write to dispatch promotion
    uses: ./.github/workflows/test.yml

  prepare:
    name: prepare release candidate
    needs: verify
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && !startsWith(github.event.head_commit.message, 'chore: release')
      && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Confirm verified main is still current
        id: current
        run: |
          git fetch origin main --tags --force
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "A newer main exists; its Release run owns the next candidate."
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
            git reset --hard "$GITHUB_SHA"
          fi
      - name: Prepare idempotent candidate
        id: candidate
        if: steps.current.outputs.superseded != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="$(node scripts/release.mjs next auto)"
          BASE_SHORT="${GITHUB_SHA:0:12}"
          BRANCH="release-candidate/v${VERSION}-${BASE_SHORT}"
          NOTES="$(node scripts/release.mjs unreleased-notes)"
          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')"
          if [ -n "$REMOTE_SHA" ]; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" --force
            node scripts/release.mjs candidate-check "$BRANCH" "$REMOTE_SHA" "$GITHUB_SHA" >/dev/null
            CANDIDATE_SHA="$REMOTE_SHA"
            echo "Reusing existing candidate $BRANCH at $CANDIDATE_SHA"
          elif [ -z "$NOTES" ]; then
            echo "No [Unreleased] notes on main; nothing to release — skipping candidate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            node scripts/release.mjs "$VERSION"
            CANDIDATE_SHA="$(git rev-parse HEAD)"
            node scripts/release.mjs candidate-check "$BRANCH" "$CANDIDATE_SHA" "$GITHUB_SHA" >/dev/null
            git push origin "$CANDIDATE_SHA:refs/heads/$BRANCH"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Dispatch Verify on exact candidate ref
        if: >-
          steps.current.outputs.superseded != 'true'
          && steps.candidate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/dispatches" -f ref="$CANDIDATE_BRANCH"

  publish:
    name: test + publish
    needs: verify
    # A workflow_dispatch carrying inputs.tag is a backfill run (evidence-only);
    # it must not publish. Only tag pushes and bare dispatches on the tag ref publish.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && !(github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Stamp identity from the tag commit only
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "PI_WISHCRAFT_BUILD_SHA=${SHA}" >> "$GITHUB_ENV"
          printf '{"source_sha":"%s"}\n' "$SHA" > build-stamp.json
      - name: Verify tag equals version source and sits on origin/main
        run: node scripts/verify-release-tag.mjs --tag "${GITHUB_REF_NAME}"
      - name: Install devDependencies
        run: npm ci --ignore-scripts
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: sh scripts/npm-publish.sh
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/github-release.sh "${GITHUB_REF_NAME}"
      - name: Pack immutable npm artifact
        run: |
          set -euo pipefail
          npm pack --ignore-scripts
          sha256sum ./*.tgz > SHA256SUMS
          cat SHA256SUMS
      - name: Upload artifact evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-wishcraft-${{ github.ref_name }}
          path: |
            *.tgz
            SHA256SUMS
          if-no-files-found: error
      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" ./*.tgz SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  backfill:
    name: Backfill GitHub Release evidence
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: rel
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$INPUT_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag ${INPUT_TAG} is not vX.Y.Z" >&2; exit 1 ;;
          esac
          # Anchored regex: only literal vX.Y.Z may flow into later shell steps.
          if ! printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag ${INPUT_TAG} is not vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.rel.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Stamp identity from the tag commit only
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "PI_WISHCRAFT_BUILD_SHA=${SHA}" >> "$GITHUB_ENV"
          printf '{"source_sha":"%s"}\n' "$SHA" > build-stamp.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify tag equals version source and sits on origin/main
        run: node scripts/verify-release-tag.mjs --tag "${{ steps.rel.outputs.tag }}"
      - name: Pack immutable npm artifact
        run: |
          set -euo pipefail
          npm pack --ignore-scripts
          sha256sum ./*.tgz > SHA256SUMS
          cat SHA256SUMS
      - name: Upload artifact evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-wishcraft-${{ steps.rel.outputs.tag }}
          path: |
            *.tgz
            SHA256SUMS
          if-no-files-found: error
      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.tgz SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "$TAG" ./*.tgz SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --title "pi-wishcraft ${TAG}" \
              --generate-notes \
              --verify-tag
          fi
