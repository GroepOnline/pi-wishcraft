name: Diagnose npm auth

# Answers one question without touching the token value: is the publishing
# credential dead, or valid but without publish rights for @groeponline?
#
# A dead token and a token that cannot publish to the scope both surface as a
# 404 on `npm publish` for a scoped package, so the release log alone cannot
# tell them apart. `npm whoami` can: 401 = invalid/expired, a username = the
# credential is alive and the problem is scope/ownership.
#
# Manual only. Prints account names and permission summaries, never the token.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whoami:
    name: npm identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Report identity, org membership and publish rights
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is empty: the secret is not delivered to this repository."
            exit 1
          fi
          echo "token length: ${#NODE_AUTH_TOKEN} characters (value never printed)"
          case "${#NODE_AUTH_TOKEN}" in
            36|40) echo "shape: 40-char classic token -- npm revoked classic tokens; a granular token is required" ;;
            *) echo "shape: not a classic 40-char token" ;;
          esac

          echo
          echo "== npm whoami =="
          if who="$(npm whoami 2>&1)"; then
            echo "authenticated as: ${who}"
          else
            echo "::error::npm whoami failed: the token is expired, revoked, or for a different registry."
            printf '%s\n' "$who"
            # Keep going: with a live-but-underprivileged token the org checks
            # below are the interesting part.
            who=""
          fi

          echo
          echo "== npm org ls groeponline (membership) =="
          if members="$(npm org ls groeponline --json 2>&1)"; then
            if printf '%s' "$members" | jq -e --arg me "$who" 'has($me)' >/dev/null 2>&1; then
              role="$(printf '%s' "$members" | jq -r --arg me "$who" '.[$me]')"
              echo "${who} is a member of the npm org 'groeponline' (role: ${role})"
            else
              echo "::warning::${who} is NOT a member of the npm org 'groeponline' -- publishing to @groeponline cannot work."
            fi
          else
            echo "::warning::cannot list org members (not an org admin, or 'groeponline' is not an npm org this account can see)"
            printf '%s\n' "$members"
          fi

          echo
          echo "== npm access list collaborators @groeponline/pi-wishcraft =="
          npm access list collaborators @groeponline/pi-wishcraft --json 2>&1 | head -40 || true

          echo
          echo "== public package metadata (no auth) =="
          npm view @groeponline/pi-wishcraft maintainers --json 2>&1 | head -10 || true
          npm view @groeponline/pi-wishcraft dist-tags.latest 2>&1 | head -3 || true

          if [ -z "$who" ]; then
            echo
            echo "::error::conclusion: the credential itself is dead (401). Rotate NPM_TOKEN."
            exit 1
          fi
