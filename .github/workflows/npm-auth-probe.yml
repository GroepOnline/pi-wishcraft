name: npm auth probe (throwaway diagnostic, never merged)

# Reads which npm auth path actually works for this repo:
#   1. the org NPM_TOKEN secret, via npm whoami
#   2. GitHub OIDC trusted publishing, via the npm token-exchange endpoint
# It publishes nothing and prints no credential values.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm / node versions
        run: |
          node --version
          npm --version

      - name: Probe 1 - org NPM_TOKEN secret
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +x
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "RESULT token: secret NPM_TOKEN is EMPTY/absent"
            exit 0
          fi
          echo "token length: ${#NPM_TOKEN} chars (value never printed)"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          set +e
          out="$(npm whoami 2>&1)"
          rc=$?
          set -e
          rm -f "$HOME/.npmrc"
          echo "npm whoami exit: $rc"
          echo "npm whoami output: $out"
          if [ "$rc" -eq 0 ]; then
            echo "RESULT token: VALID (authenticated as $out)"
          else
            echo "RESULT token: INVALID"
          fi

      - name: Probe 2 - OIDC trusted publishing exchange
        run: |
          set +x
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "RESULT oidc: no ACTIONS_ID_TOKEN_REQUEST_URL (id-token permission missing)"
            exit 0
          fi
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org"
          curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" -o /tmp/idtoken.json
          id_token="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/idtoken.json','utf8')).value || ''")"
          if [ -z "$id_token" ]; then
            echo "RESULT oidc: GitHub did not return an id_token"
            cat /tmp/idtoken.json
            exit 0
          fi
          echo "id_token claims:"
          node -e '
            const t = process.argv[1];
            const p = JSON.parse(Buffer.from(t.split(".")[1], "base64").toString("utf8"));
            console.log(JSON.stringify({
              repository: p.repository,
              repository_owner: p.repository_owner,
              workflow_ref: p.workflow_ref,
              ref: p.ref,
              event_name: p.event_name,
              repository_visibility: p.repository_visibility,
            }, null, 2));
          ' "$id_token"
          code="$(curl -sS -o /tmp/exchange.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${id_token}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@groeponline%2fpi-wishcraft")"
          echo "exchange HTTP status: $code"
          echo "exchange body:"
          cat /tmp/exchange.json
          echo
          echo "RESULT oidc: status $code"
