name: Dist tag cleanup

# One-off: remove leftover marker dist-tags (release-X.Y.Z) that
# npm-publish.sh leaves behind next to `latest`.

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Remove marker dist-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -u
          for TAG in release-1.4.5 release-1.4.6 release-1.4.7; do
            if npm dist-tag rm @groeponline/pi-wishcraft "$TAG"; then
              echo "removed $TAG"
            else
              echo "could not remove $TAG (probably already gone)"
            fi
          done
          npm dist-tag ls @groeponline/pi-wishcraft
