name: Diagnose npm token scope

# One-shot diagnostic: why does npm deprecate of @groeponline/pi-powerline-footer
# return E422 while publish of @groeponline/pi-wishcraft succeeds? Prints account
# + accessible packages only (no secret values). Delete after use.
on:
  workflow_dispatch:

jobs:
  diagnose:
    name: npm whoami + access ls-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: whoami
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: token type (granular vs legacy)
        run: |
          # Granular tokens start with "npm_"; legacy automation tokens do not.
          # Print only the prefix + length, never the full token.
          PREFIX=$(printf '%s' "$NODE_AUTH_TOKEN" | cut -c1-4)
          LEN=$(printf '%s' "$NODE_AUTH_TOKEN" | wc -c)
          echo "token prefix: $PREFIX  length: $LEN"
          [ "$PREFIX" = "npm_" ] && echo "TYPE: granular" || echo "TYPE: legacy/classic"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: accessible packages under chefgroeponline
        run: npm access ls-packages chefgroeponline || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: attempt deprecate with json error
        run: |
          npm deprecate "@groeponline/pi-powerline-footer" "Renamed to @groeponline/pi-wishcraft. Install npm:@groeponline/pi-wishcraft instead." --json 2>&1 || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
